name: ci
on:
  push:
  pull_request:

env:
  DATABASE_URL: postgres://postgres:postgres@localhost:5432/fleetos

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: fleetos }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/fleetos
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with: { version: 9 }
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Build shared (dist is gitignored; tests import @fleetos/shared)
        run: pnpm --filter @fleetos/shared build
      - name: Lint and typecheck
        run: pnpm lint && pnpm typecheck
      - name: Ops/finance import boundary
        run: pnpm lint:boundaries
      - name: Migrate test DB
        run: pnpm db:migrate
      - name: Migration linter (tenant_id + RLS + no finance grants to ops)
        run: pnpm db:lint
      - name: Generated RLS isolation suite
        run: pnpm test:isolation
      - name: Finance denial suite (app_ops must be denied on every finance object)
        run: pnpm test:finance-denial
      - name: Append-only and edit-window suite
        run: pnpm test:append-only
      - name: Unit and integration
        run: pnpm test
      - name: OpenAPI drift
        run: pnpm openapi:dump && git diff --exit-code packages/api/openapi.json
      - name: Web build
        run: pnpm --filter web build
  e2e:
    needs: checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: fleetos }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/fleetos
      JWT_SECRET: ci-test-secret
      NEXT_PUBLIC_API_URL: http://localhost:3001
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with: { version: 9 }
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @fleetos/shared build
      - run: pnpm db:migrate && pnpm db:seed
      - run: pnpm --filter @fleetos/api build
      - name: Start API in background
        run: (pnpm --filter @fleetos/api start > /tmp/api.log 2>&1 &) && sleep 15 && curl -sf http://localhost:3001/v1/health || (cat /tmp/api.log && exit 1)
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm --filter web exec playwright test
  cdk-diff:
    needs: checks
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # Informational until AWS_DEV_ROLE_ARN is configured; never block merges.
    continue-on-error: true
    permissions: { id-token: write, contents: read, pull-requests: write }
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with: { version: 9 }
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Check AWS role configured (informational; skip diff if missing)
        id: aws-check
        run: |
          if [ -z "${{ secrets.AWS_DEV_ROLE_ARN }}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::AWS_DEV_ROLE_ARN is not configured; skipping CDK diff."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: aws-actions/configure-aws-credentials@v6
        if: steps.aws-check.outputs.configured == 'true'
        with:
          role-to-assume: ${{ secrets.AWS_DEV_ROLE_ARN }}
          aws-region: ap-south-1
      - name: CDK diff (dev only)
        if: steps.aws-check.outputs.configured == 'true'
        run: pnpm --filter infra cdk diff FleetOS-dev > cdk-diff.txt || true
      - uses: actions/github-script@v8
        if: steps.aws-check.outputs.configured == 'true'
        with:
          script: |
            const fs = require('fs'); const body = '```\n' + fs.readFileSync('cdk-diff.txt','utf8').slice(0, 60000) + '\n```';
            github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body: 'CDK diff (dev):\n' + body });
  deploy-dev:
    needs: [checks, e2e]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions: { id-token: write, contents: read }
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with: { version: 9 }
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Check AWS role configured
        run: |
          if [ -z "${{ secrets.AWS_DEV_ROLE_ARN }}" ]; then
            echo "::error::AWS_DEV_ROLE_ARN secret is not configured. Create the dev deploy role and add it as a repo secret (see docs/TSD.md infra section)."
            exit 1
          fi
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEV_ROLE_ARN }}
          aws-region: ap-south-1
      - run: pnpm --filter infra cdk deploy FleetOS-dev --require-approval never
  # prod deploy is a separate manual workflow (deploy-prod.yml) with an environment approval gate.
