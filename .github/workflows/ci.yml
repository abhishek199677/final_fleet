name: Fleet OS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint

  test-db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: fleetos_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fleetos_test
      - run: cd packages/db && node generators/test-isolation.js fleetos_test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fleetos_test
      - run: cd packages/db && node generators/test-finance-denial.js fleetos_test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fleetos_test
      - run: cd packages/db && node generators/test-append-only.js fleetos_test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fleetos_test
