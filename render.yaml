services:
  - type: postgres
    name: fleetos-db
    plan: free
    databaseName: fleetos
    user: fleetos

  - type: web
    name: fleetos-api
    runtime: docker
    dockerfilePath: packages/api/Dockerfile
    envVars:
      - key: API_PORT
        value: "3001"
      - key: NODE_ENV
        value: production
      - key: UPLOAD_DIR
        value: /tmp/uploads
      - key: EXPORT_DIR
        value: /tmp/exports
      - key: DATABASE_URL
        fromDatabase:
          name: fleetos-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

  - type: web
    name: fleetos-web
    runtime: docker
    dockerfilePath: packages/web/Dockerfile
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://fleetos-api.onrender.com
      - key: API_URL
        value: https://fleetos-api.onrender.com
