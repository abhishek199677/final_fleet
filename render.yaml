services:
  - type: web
    name: fleetos-api
    runtime: docker
    dockerfilePath: packages/api/Dockerfile
    envVars:
      - key: API_PORT
        value: "3001"
      - key: NODE_ENV
        value: production
      - key: UPLOAD_DIR
        value: /tmp/uploads
      - key: EXPORT_DIR
        value: /tmp/exports

  - type: web
    name: fleetos-web
    runtime: docker
    dockerfilePath: packages/web/Dockerfile
